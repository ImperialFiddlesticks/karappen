name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      ["backend/**", ".github/workflows/backend.yml", "docker-compose.prod.yml"]
  pull_request:
    paths:
      ["backend/**", ".github/workflows/backend.yml", "docker-compose.prod.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: karappen
          POSTGRES_PASSWORD: karappen
          POSTGRES_DB: karappen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://karappen:karappen@localhost:5432/karappen_test
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node db/migrate.js
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg Docker-image
        run: docker build -t karappen-backend ./backend

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Kopiera filer till servern
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude node_modules --exclude .env \
            backend docker-compose.prod.yml \
            "ubuntu@$EC2_HOST:karappen/"

      - name: Starta om på servern
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" \
            "cd ~/karappen && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
