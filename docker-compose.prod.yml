# Production on EC2: Postgres and backend
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karappen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: karappen
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karappen"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://karappen:${POSTGRES_PASSWORD}@db:5432/karappen
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "80:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
